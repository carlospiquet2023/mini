<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; connect-src 'self'">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CP Games">
  <meta name="theme-color" content="#7c3aed">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="Carlos Piquet Games — console portátil com sete minijogos arcade, online e offline.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <title>Carlos Piquet Games</title>

  <!-- CSS Architecture: Layers -->
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body data-theme="default">

  <main class="console-wrapper" aria-label="Carlos Piquet Games">

    <!-- ============================
         CONSOLE TOP — Screen Area
         ============================ -->
    <div class="console-top">
      <!-- Decorative side stripes -->
      <div class="decor-stripe-left"></div>
      <div class="decor-stripe-right"></div>

      <!-- Screen Bezel -->
      <div class="screen-bezel">

        <!-- LAYER 1: Ball Game (default) -->
        <div class="balls-layer" id="balls-layer">
          <div class="balls-background" id="balls-bg"></div>
          <canvas id="game-canvas" role="img" aria-label="Jogo das Bolinhas">Seu navegador não suporta jogos em canvas.</canvas>

          <!-- Win Overlay -->
          <div class="win-overlay" id="win-message">
            <h2>🎉 Parabéns!</h2>
            <p>Você acertou todas as bolas!</p>
            <button type="button" id="reset-button">Jogar Novamente</button>
          </div>
        </div>

        <!-- LAYER 2: Mini-Games (snake / space / pacman / tetris) -->
        <div class="mini-layer" id="mini-layer">
          <canvas id="mini-canvas" role="img" aria-label="Minijogo selecionado">Seu navegador não suporta jogos em canvas.</canvas>
        </div>

        <!-- Screen Flash (theme transition effect) -->
        <div class="screen-flash" id="screen-flash"></div>

        <!-- Modal Overlay for Selecting Mini-Games -->
        <div class="games-modal-overlay" id="games-modal" aria-hidden="true">
          <div class="games-modal-content" role="dialog" aria-modal="true" aria-labelledby="games-modal-title">
            <div class="games-modal-header">
              <span class="games-modal-title" id="games-modal-title">🎮 SELEÇÃO DE JOGOS</span>
              <button type="button" class="games-modal-close" id="close-games-modal" aria-label="Fechar menu">✕</button>
            </div>
            <div class="games-grid-menu">
              <button type="button" class="game-card-btn" id="select-worm" data-game="worm">
                <span class="game-card-icon">🐛</span>
                <div class="game-card-info">
                  <span class="game-card-name">Minhoca Voraz</span>
                  <span class="game-card-desc">Jogo clássico da cobra</span>
                </div>
              </button>

              <button type="button" class="game-card-btn" id="select-space" data-game="space">
                <span class="game-card-icon">🚀</span>
                <div class="game-card-info">
                  <span class="game-card-name">Nave na Galáxia</span>
                  <span class="game-card-desc">Shooter com 4 Chefões</span>
                </div>
              </button>

              <button type="button" class="game-card-btn" id="select-pacman" data-game="pacman">
                <span class="game-card-icon">🟡</span>
                <div class="game-card-info">
                  <span class="game-card-name">Pac-Man Retro</span>
                  <span class="game-card-desc">Labirinto Arcade Fantasma</span>
                </div>
              </button>

              <button type="button" class="game-card-btn" id="select-tetris" data-game="tetris">
                <span class="game-card-icon">🧱</span>
                <div class="game-card-info">
                  <span class="game-card-name">Tetris Classic</span>
                  <span class="game-card-desc">Jogo dos Blocos</span>
                </div>
              </button>

              <button type="button" class="game-card-btn" id="select-runner" data-game="runner">
                <span class="game-card-icon">🏃</span>
                <div class="game-card-info">
                  <span class="game-card-name">Super Pulo</span>
                  <span class="game-card-desc">Corredor de Obstáculos</span>
                </div>
              </button>

              <button type="button" class="game-card-btn" id="select-mermaid" data-game="mermaid">
                <span class="game-card-icon">🧜‍♀️</span>
                <div class="game-card-info">
                  <span class="game-card-name">Sereia & Borboleta</span>
                  <span class="game-card-desc">Aventura Aquática Mágica</span>
                </div>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- ============================
         CONSOLE BOTTOM — Controls
         ============================ -->
    <div class="console-bottom">

      <!-- Brand & Info Bar -->
      <div class="brand-bar">
        <!-- Visor Digital LCD do Placar (Esquerda) -->
        <div class="score-digital-box" id="score-box" title="Pontuação" aria-live="polite">
          <span class="score-lbl" id="score-lbl">SCORE</span>
          <span class="score-val" id="score">0</span>
        </div>

        <!-- Assinatura Elegante da Marca (Centro) -->
        <div class="name-banner">
          <span>Carlos Piquet</span>
        </div>

        <!-- Botão Voltar (Na Barra da Marca conforme indicado pela seta vermelha) -->
        <button type="button" class="back-pill-btn mini-only-ui" id="back-btn" aria-label="Voltar ao jogo das bolinhas" title="Voltar ao jogo das bolinhas">
          🔙 Voltar
        </button>

        <!-- Visor Digital LCD do Nível/Status (Direita) -->
        <div class="status-digital-box" id="status-box" title="Status do jogo" aria-live="polite">
          <span class="status-lbl" id="status-lbl">LEVEL</span>
          <span class="status-val" id="status-val">1</span>
          <button type="button" class="mini-reset-btn" id="reset-game" aria-label="Reiniciar jogo" title="Reiniciar jogo">
            <span class="reset-icon">🔄</span>
          </button>
        </div>
      </div>

      <!-- Controls Row -->
      <div class="controls-row">

        <!-- Left Controls Container -->
        <div class="left-controls">
          <!-- D-PAD Cross (Mini-Games Only) -->
          <div class="dpad-container mini-only-ui" role="group" aria-label="Direcional">
            <div class="dpad-cross">
              <button type="button" id="dpad-up" class="dpad-btn dpad-up" aria-label="Cima" title="Cima (▲)"></button>
              <button type="button" id="dpad-left" class="dpad-btn dpad-left" aria-label="Esquerda" title="Esquerda (◄)"></button>
              <div class="dpad-center">❖</div>
              <button type="button" id="dpad-right" class="dpad-btn dpad-right" aria-label="Direita" title="Direita (►)"></button>
              <button type="button" id="dpad-down" class="dpad-btn dpad-down" aria-label="Baixo" title="Baixo (▼)"></button>
            </div>
          </div>

          <!-- Big Left Pump Button (Ball Game Only) -->
          <div class="action-btn-wrapper ball-only-ui">
            <button type="button" id="button-a" class="rotate-button" aria-label="Ação A / jato esquerdo" title="Ação A / jato esquerdo"></button>
          </div>
        </div>

        <!-- Game Selector (+ JOGOS single button) -->
        <div class="selector-group">
          <button type="button" id="open-games-menu" class="more-games-pill-btn" aria-label="Abrir lista de jogos" title="Abrir menu de jogos" aria-haspopup="dialog" aria-controls="games-modal" aria-expanded="false">
            🎮 + JOGOS
          </button>
        </div>

        <!-- Right Controls Container -->
        <div class="right-controls">
          <div class="action-btn-wrapper">
            <div class="rotate-label mini-only-ui">
              <span class="rotate-arrow">↶</span>
              <span class="rotate-text">ROTATE</span>
            </div>
            <button type="button" id="button-b" class="rotate-button" aria-label="Ação B / jato direito" title="Ação B / jato direito"></button>
          </div>
        </div>

      </div>
    </div>

  </main>

  <!-- Física local para o jogo principal e suporte offline completo. -->
  <script src="vendor/matter.min.js" defer></script>

  <!-- App Entry Point (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
